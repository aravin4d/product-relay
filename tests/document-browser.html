<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Relay document checks</title><style>body{font:15px/1.8 system-ui;max-width:900px;margin:50px auto;padding:20px;color:#202124}button{background:#1a73e8;color:white;border:0;border-radius:20px;padding:12px 24px;cursor:pointer}pre{white-space:pre-wrap;background:#f8fafd;padding:25px;border-radius:16px}</style><h1>Local document parser checks</h1><p>Runs fictional PDF/DOCX documents through the real browser extraction worker, then verifies source location persistence. No project data or files are uploaded.</p><button id="run">Run document checks</button><pre id="results" role="status">Ready.</pre><script type="module">
import {extractDocument,reconcileDocumentEdit,findDuplicateDocument} from '/src/documents.js';
import {createProject,addSource,addSection,exportProject,importProject} from '/src/domain.js';
const results=document.querySelector('#results'),button=document.querySelector('#run');const assert=(value,message)=>{if(!value)throw new Error(message);};
button.onclick=async()=>{
 button.disabled=true;results.textContent='';let count=0;
 const check=async(name,fn)=>{await fn();results.textContent+='PASS · '+name+'\n';count++;};
 try{
  let pdf,docx;
  await check('PDF.js worker reads two pages and preserves fraud qualifiers',async()=>{const response=await fetch('/tests/fixtures/orbit-cancellation.pdf');assert(response.ok,'PDF fixture missing');pdf=await extractDocument(new File([await response.arrayBuffer()],'orbit-cancellation.pdf'));assert(pdf.metadata.pageCount===2,'Missing PDF pages');assert(pdf.content.includes('only for confirmed fraud'),'Lost condition');assert(pdf.metadata.blocks[1].location.page===2,'Missing page location');});
  await check('Mammoth worker extracts paragraphs without executing source markup',async()=>{const response=await fetch('/tests/fixtures/orbit-cancellation.docx');assert(response.ok,'DOCX fixture missing');docx=await extractDocument(new File([await response.arrayBuffer()],'orbit-cancellation.docx'));assert(docx.content.includes('<script>alert("fictional")<\/script>'),'Literal source text missing');assert(docx.metadata.blocks[2].location.paragraph===3,'Missing paragraph location');assert(document.querySelectorAll('script').length===1,'Source markup entered the document');});
  await check('PDF location survives project export and reopen',async()=>{const project=createProject('Fictional document parser check');const source=addSource(project,'Cancellation PDF',pdf.content,'PRD',pdf.metadata);const section=addSection(project,{title:'Fraud rule',body:'Confirmed fraud revokes access immediately.',sourceId:source.id,quote:'Access is revoked immediately only for confirmed fraud.'});const reopened=importProject(exportProject(project));assert(reopened.sources[0].revisions[0].document.blocks[1].location.page===2,'Document metadata lost');assert(reopened.sections[0].evidence[0].locations?.[0]?.page===2,'Evidence page reference lost');});
  await check('Edited preview removes unavailable original locations',async()=>{const edited=reconcileDocumentEdit(pdf,pdf.content+'\nCorrected context.');assert(edited.metadata.reviewed===true,'Missing correction flag');assert(!edited.metadata.blocks[0].location.page,'Incorrect original page claimed');});
  await check('Exact file duplicate is detected before committing another source',async()=>{const project=createProject('Fictional duplicate check');const source=addSource(project,'Original PDF',pdf.content,'PRD',pdf.metadata);assert(findDuplicateDocument(project,pdf).sourceId===source.id,'Duplicate not found');});
  await check('Malformed DOCX and cancelled imports fail safely',async()=>{let rejected=false;try{await extractDocument(new File(['not-a-zip'],'broken.docx'));}catch{rejected=true;}assert(rejected,'Malformed DOCX accepted');const controller=new AbortController();controller.abort();rejected=false;try{await extractDocument(new File(['Rule'],'cancelled.txt'),{signal:controller.signal});}catch(error){rejected=error.code==='document-cancelled';}assert(rejected,'Abort not handled');});
  results.textContent+='\n'+count+' document browser checks passed.';
 }catch(error){results.textContent+='FAIL · '+error.message;}
 finally{button.disabled=false;}
};
</script></html>
