<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Relay performance evidence</title><style>body{font:16px Arial;max-width:900px;margin:40px auto;padding:16px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Phase 2 browser performance evidence</h1><p>Runs only when explicitly started. Uses fictional records and no provider or backend. Save and reopen timings include actual Web Crypto processing. Results establish this browser and dataset only.</p><label>Fictional requirements <input id="size" type="number" value="500" min="10" max="5000"></label><button id="run">Measure this browser</button><button id="export" disabled>Export actual measurements</button><pre id="results" aria-live="polite">Not run</pre><script type="module">
import * as D from '../src/domain.js';import * as L from '../src/lifecycle.js';import * as T from '../src/project-tools.js';import {createVault,openVault} from '../src/vault.js';import {retrieveKnowledge} from '../src/knowledge.js';let report;
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;document.querySelector('#export').disabled=true;report=null;try{const count=Number(document.querySelector('#size').value);if(!Number.isInteger(count)||count<10||count>5000)throw new Error('Choose 10–5,000 records.');const p=D.createProject('Fictional performance dataset'),m=D.addMember(p,'Fixture PM','Product'),s=D.addSource(p,'Fixture source','Ordinary cancellation keeps paid access until the billing period ends.');for(let i=0;i<count;i++){const r=L.addRecord(p,'requirements',{title:'Cancellation '+i,scope:{state:'general'},evidence:[D.makeEvidence(p,s.id,s.revisions[0].content)],data:{type:'behavior',description:s.revisions[0].content}},m.id);L.approveRecord(p,'requirements',r.id,m.id,'Fictional fixture only');}const measure=async fn=>{const start=performance.now();await fn();return Math.round(performance.now()-start);};const samples=[];for(let trial=0;trial<5;trial++){let bundle,vault;const exportMs=await measure(()=>{bundle=D.exportProject(p);}),queryMs=await measure(()=>retrieveKnowledge(p,'cancellation billing period',{role:'Everyone'})),saveMs=await measure(async()=>{vault=await createVault(JSON.parse(bundle),'fictional performance passphrase');}),reopenMs=await measure(async()=>D.importProject(JSON.stringify((await openVault(vault.envelope,'fictional performance passphrase')).data)));samples.push({exportMs,queryMs,saveMs,reopenMs,serializedCharacters:bundle.length});}const measurements=Object.fromEntries(['exportMs','queryMs','saveMs','reopenMs'].map(key=>{const values=samples.map(s=>s[key]).sort((a,b)=>a-b);return [key,{median:values[2],p95:values[4]}];}));report={format:'relay-performance-evidence',version:2,at:new Date().toISOString(),browser:navigator.userAgent,requirements:count,serializedCharacters:samples[0].serializedCharacters,samples,measurements,budgets:T.PERFORMANCE_BUDGETS,limitations:['Five sequential trials; p95 is the maximum observed sample, not a reliable population percentile. First trial is retained.','No UI/IndexedDB/file-system/network/merge latency or peak memory measured.','Fictional dataset includes requirement histories but no parent archives or large original assets.']};document.querySelector('#results').textContent=JSON.stringify(report,null,2);document.querySelector('#export').disabled=false;}catch(error){document.querySelector('#results').textContent=error.message;}finally{button.disabled=false;}};document.querySelector('#export').onclick=()=>{const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));link.href=url;link.download='relay-performance.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
