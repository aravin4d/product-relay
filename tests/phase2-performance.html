<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Relay performance evidence</title><style>body{font:16px Arial;max-width:900px;margin:40px auto;padding:16px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Phase 2 browser performance evidence</h1><p>Runs only when explicitly started. Uses fictional records and no provider or backend. Save and reopen timings include actual Web Crypto processing. Results establish this browser and dataset only.</p><label>Fictional requirements <input id="size" type="number" value="500" min="10" max="3000"></label><button id="run">Measure this browser</button><button id="export" disabled>Export actual measurements</button><pre id="results" aria-live="polite">Not run</pre><script type="module">
import * as D from '../src/domain.js';import * as L from '../src/lifecycle.js';import * as T from '../src/project-tools.js';import {createVault,openVault} from '../src/vault.js';import {retrieveKnowledge} from '../src/knowledge.js';let report;
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;try{const count=Number(document.querySelector('#size').value);if(!Number.isInteger(count)||count<10||count>3000)throw new Error('Choose 10–3,000 records.');const p=D.createProject('Fictional performance dataset'),m=D.addMember(p,'Fixture PM','Product'),s=D.addSource(p,'Fixture source','Ordinary cancellation keeps paid access until the billing period ends.');for(let i=0;i<count;i++){const r=L.addRecord(p,'requirements',{title:'Cancellation '+i,scope:{state:'general'},evidence:[D.makeEvidence(p,s.id,s.revisions[0].content)],data:{type:'behavior',description:s.revisions[0].content}},m.id);L.approveRecord(p,'requirements',r.id,m.id,'Fictional fixture only');}const measure=async fn=>{const start=performance.now();await fn();return Math.round(performance.now()-start);};let bundle,vault;const exportMs=await measure(()=>{bundle=D.exportProject(p);}),queryMs=await measure(()=>retrieveKnowledge(p,'cancellation billing period',{role:'Everyone'})),saveMs=await measure(async()=>{vault=await createVault(JSON.parse(bundle),'fictional performance passphrase');}),reopenMs=await measure(async()=>D.importProject(JSON.stringify((await openVault(vault.envelope,'fictional performance passphrase')).data)));report={format:'relay-performance-evidence',version:1,at:new Date().toISOString(),browser:navigator.userAgent,requirements:count,serializedCharacters:bundle.length,measurements:{exportMs,queryMs,saveMs,reopenMs},budgets:T.PERFORMANCE_BUDGETS,limitations:['Single run; repeat with warm/cold trials and median/p95.','No UI/IndexedDB/file-system/network/merge latency measured.']};document.querySelector('#results').textContent=JSON.stringify(report,null,2);document.querySelector('#export').disabled=false;}catch(error){document.querySelector('#results').textContent=error.message;}finally{button.disabled=false;}};document.querySelector('#export').onclick=()=>{const link=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));link.href=url;link.download='relay-performance.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
